# Seed inicial para /var/lib/dl-conn/config.yaml no host n100.
#
# services.dl-conn.configFile aponta para /var/lib/dl-conn/config.yaml
# (gravável) em vez de gerar o YAML no /nix/store (read-only), para que
# `dl_conn npubs add <npub>` possa autorizar dispositivos em runtime sem
# nixos-rebuild + restart do serviço (o que derrubaria o túnel Cloudflare
# efêmero atual e a URL trycloudflare.com já distribuída).
#
# O módulo NÃO copia este arquivo sozinho — é preciso instalá-lo manualmente
# uma vez (ver comando em hosts/n100/default.nix). Depois disso, este
# arquivo aqui no repo deixa de ser a fonte de verdade: ele serve só como
# referência/backup do estado inicial. Edições em runtime via
# `dl_conn npubs add` acontecem direto em /var/lib/dl-conn/config.yaml e
# não são refletidas aqui automaticamente.
nostr:
  relays:
    - "wss://relay.damus.io"
    - "wss://nos.lol"
    - "wss://relay.nostr.band"
    - "wss://relay.primal.net"
    - "wss://nostr.mom"
    - "wss://relay.snort.social"
    - "wss://nostr.oxtr.dev"
    - "wss://nostr.land"
  authorizedNpubs:
    - "npub19eza5qtcr620pufewsnjdvk2c540naaa43nuhzn336myuswzc77sd0jd8z"
    - "npub1e247rm7ndy0p9reyhrhtwckkkkxpqpd8ya5m0qa22f7evuacmkwspjxh0y"
  fallbackNip04: false
tunnel:
  listenPort: 9099
  cloudflaredPath: "cloudflared"
  autoStart: true
  inactivityTimeout: "10m"
auth:
  tokenTTL: "120s"
  sessionTTL: "4h"
services:
  - id: "hass"
    name: "Home Assistant"
    icon: "home"
    prefix: "/hass"
    target: "http://10.1.1.10:8123"
    stripPrefix: true
    websocket: true
    # HASS answers 400 to every request while dl_conn is not in its
    # trusted_proxies. Remove once HA has "use_x_forwarded_for: true"
    # + "trusted_proxies: [10.1.1.1]".
    forwardedFor: false
  - id: "frigate"
    name: "Frigate"
    icon: "video"
    prefix: "/frigate"
    target: "http://10.0.66.1:5000"
    stripPrefix: true
    websocket: false
    rootPaths:
      - "/locales/"
  - id: "frigate-api"
    name: "Frigate API"
    icon: "video"
    prefix: "/api"
    target: "http://10.0.66.1:5000"
    stripPrefix: false
    websocket: false
    hidden: true
  - id: "frigate-ws"
    name: "Frigate WebSocket"
    icon: "video"
    prefix: "/ws"
    target: "http://10.0.66.1:5000"
    stripPrefix: false
    websocket: true
    hidden: true
  - id: "zigbee2mqtt"
    name: "Zigbee2MQTT"
    icon: "router"
    prefix: "/zigbee2mqtt"
    target: "http://10.1.1.8:8080"
    stripPrefix: true
    websocket: true
  - id: "glances"
    name: "Glances"
    icon: "activity"
    prefix: "/glances"
    target: "http://10.0.66.1:61208"
    stripPrefix: true
    websocket: true
  - id: "pi-web"
    name: "Pi Web"
    icon: "code"
    description: "Interface web do agente Pi"
    prefix: "/pi-web"
    target: "http://127.0.0.1:8584"
    stripPrefix: true
    websocket: true
  - id: "9router"
    name: "9Router"
    icon: "cpu"
    description: "Gateway AI local"
    prefix: "/9router"
    target: "http://127.0.0.1:20128"
    stripPrefix: true
    websocket: true
  - id: "dsh"
    name: "DeepSeek Harness"
    icon: "terminal"
    description: "DeepSeek Harness (dsh) web profile"
    prefix: "/dsh"
    target: "http://127.0.0.1:3080"
    stripPrefix: true
    websocket: true
    # O dsh cerca /api pelo header Host para se defender de DNS rebinding:
    # aceita só loopback (ou uma autoridade --trusted-host) e recusa o que
    # tiver Origin de outra origem. Pelo túnel o browser manda o hostname
    # público nos dois, então o HTML carrega mas toda chamada de API e o
    # WebSocket levam 403.
    #
    # originHost apresenta a requisição ao backend como se tivesse chegado
    # direto nele (reescreve Host, remove Origin/Sec-Fetch-Site). O hostname
    # efêmero do trycloudflare.com deixa de importar — é o que faz isso
    # funcionar sem fixar o túnel em lugar nenhum e sem reiniciar o dsh a
    # cada rotação (reinício trocaria o token de lançamento).
    originHost: "127.0.0.1:3080"
telemetry:
  enabled: true
  intervalSeconds: 10
  retentionDays: 7
  exposeViaNostr: true
