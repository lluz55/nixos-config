[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[profile.dev]
incremental = true

# Optional faster local rebuilds after refreshing this template to a newer Bevy
# and nightly Rust toolchain:
# [unstable]
# codegen-backend = true
#
# Add this under the existing [profile.dev] table above:
# codegen-backend = "cranelift"
#
# [profile.dev.package."*"]
# codegen-backend = "llvm"
