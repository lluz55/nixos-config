/* =====================================================================
   prompt-to-deck v2.4 — theme + typography + animation tokens.
   Six named palettes (see PALETTES below) ship with WCAG-verified
   contrast ratios. The default palette is Midnight Indigo; users pick
   per-deck via plan.palette. All CSS vars are emitted per palette
   below the :root block.
   Modular type scale (em; reveal root=40px). Animation utilities for
   text reveal (slide-in / fade-up / typewriter) and a CSS-only shimmer
   fallback for the count-up indicator (real countup is JS-driven, see
   COUNTUP_JS).
   ===================================================================== */

:root {
  /* === Modular type scale (em; reveal root=40px) === */
  --fs-cover:   3.6em;   /* 144 — cover h1 hero */
  --fs-hero:    2.6em;   /* 104 — stat number, quote, big emphasis */
  --fs-title:   2.0em;   /*  80 — h2 slide title */
  --fs-body:    1.1em;   /*  44 — bullet, body */
  --fs-caption: 0.7em;   /*  28 — stat label, sub-line */
  --fs-small:   0.55em;  /*  22 — footer, source */
  --fs-micro:   0.45em;  /*  18 — page number */
  --lh-display: 1.05;
  --lh-title:   1.15;
  --lh-body:    1.4;
  --lh-caption: 1.25;

  /* === DEFAULT THEME — executive-dark (Midnight Indigo 2026) === */
  --bg:        #0e1325;        /* hsl(232, 28%,  7%) — deep navy-black */
  --bg-2:      #1a1f3d;        /* hsl(245, 30%, 17%) — indigo elevation */
  --fg:        #eef1f7;        /* hsl(220, 30%, 96%) — off-white (no halation) */
  --muted:     #a7afc5;        /* hsl(225, 16%, 70%) — cool gray, 7.2:1 contrast */
  --accent:    #60a5fa;        /* hsl(213, 94%, 68%) — sky-400, 8.5:1 on bg */
  --accent-2:  #fbbf24;        /* hsl(45, 96%, 56%)  — amber-400, 10:1 on bg */
  --card:      #181e36;        /* hsl(230, 24%, 15%) — surface elevation */
  --border:    #262c45;        /* hsl(232, 18%, 22%) — subtle border */
  --gradient:  linear-gradient(135deg, #0e1325 0%, #1a1f3d 100%);
  /* Chart palette — Okabe-Ito inspired, colorblind-safe on dark bg */
  --c1:        #60a5fa; --c2: #fbbf24; --c3: #34d399;
  --c4:        #f472b6; --c5: #a78bfa; --c6: #fb7185;
  --c7:        #38bdf8; --c8: #facc15;
}

.reveal { background: var(--bg); color: var(--fg); }
.reveal .slides { text-align: left; }
.reveal .slides section { padding: 64px 80px; height: 100%; box-sizing: border-box;
  background: var(--gradient); }
.reveal h1, .reveal h2, .reveal h3 { color: var(--fg); text-transform: none; letter-spacing: normal; }
.reveal h1 { font-size: var(--fs-cover); font-weight: 800; line-height: var(--lh-display);
  background: linear-gradient(90deg, var(--fg), var(--accent));
  -webkit-background-clip: text; background-clip: text; color: transparent; }
.reveal h2 { font-size: var(--fs-title); font-weight: 700; line-height: var(--lh-title);
  border-bottom: 4px solid var(--accent); padding-bottom: 0.3em; margin: 0 0 0.6em; }
.reveal h3 { font-size: var(--fs-body); font-weight: 600; color: var(--accent); margin: 0.5em 0; }
.reveal .kicker { color: var(--accent); font-weight: 600; letter-spacing: 0.2em;
  text-transform: uppercase; font-size: var(--fs-caption); margin-bottom: 0.5em; }
.reveal .sub { color: var(--muted); font-size: 0.85em; line-height: var(--lh-body);
  margin-top: 0.6em; }
.reveal .bullets { list-style: none; padding: 0; margin: 0; }
.reveal .bullets li { font-size: var(--fs-body); line-height: var(--lh-body); margin: 0.6em 0;
  padding-left: 1.2em; position: relative; }
.reveal .bullets li::before { content: '▸'; color: var(--accent-2); position: absolute; left: 0; font-weight: 700; }
.reveal .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5em; margin-top: 1em; }
.reveal .stat { background: var(--card); border: 1px solid var(--border);
  border-radius: 1em; padding: 1em; text-align: center; }
.reveal .stat .v { font-size: var(--fs-hero); font-weight: 800; color: var(--accent); line-height: var(--lh-display); }
/* Stats color modes: cycle (default per-card accent), gradient (text gradient),
   semantic (positive/negative/neutral). Plan field stats_color picks the mode. */
.stat-v-gradient {
  background-clip: text; -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat-v-cycle-0 { color: var(--c1); } .stat-v-cycle-1 { color: var(--c2); }
.stat-v-cycle-2 { color: var(--c3); } .stat-v-cycle-3 { color: var(--c4); }
.stat-v-pos { color: #34d399; } .stat-v-neg { color: #fb7185; } .stat-v-neu { color: var(--fg); }
.reveal .stat .u { display: block; font-size: var(--fs-caption); color: var(--muted); margin-top: 0.3em; font-weight: 500; }
.reveal .stat .l { font-size: var(--fs-caption); color: var(--muted); margin-top: 0.6em; line-height: var(--lh-caption); }
.reveal blockquote { font-size: 1.8em; font-style: italic; max-width: 80%;
  margin: 0 auto; line-height: var(--lh-title); color: var(--fg); }
.reveal blockquote::before, .reveal blockquote::after { content: '"'; color: var(--accent); font-weight: 700; }
.reveal .cite { display: block; margin-top: 1em; font-size: var(--fs-caption); color: var(--muted); text-align: center; font-style: normal; }
.reveal .slide-foot { position: absolute; bottom: 1em; left: 80px; right: 80px;
  display: flex; justify-content: space-between; font-size: var(--fs-small); color: var(--muted); }
.reveal .slide-foot a { color: var(--accent); text-decoration: none; }
.reveal .slide-foot a:hover { text-decoration: underline; }
.reveal .slide-foot .pn { font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace; }
.reveal section.cover, .section.custom { display: flex; flex-direction: column; justify-content: center; }
.reveal section.closing { display: flex; flex-direction: column; justify-content: center;
  align-items: center; text-align: center; }

/* ===== Layouts v2.4 — comparison / timeline / process / cards ===== */

/* Comparison: two equal columns with vs/versus divider. */
.reveal .comparison, .slide-standalone.comparison {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 0;
  align-items: stretch; height: 100%;
}
.reveal .comparison .col, .slide-standalone.comparison .col {
  padding: 0.5em 1.2em; display: flex; flex-direction: column; gap: 0.4em;
  background: color-mix(in srgb, var(--card) 60%, transparent);
  border-radius: 1em;
}
.reveal .comparison .col + .vs, .slide-standalone.comparison .vs {
  display: flex; align-items: center; justify-content: center;
  font: 800 1.6em 'Manrope', sans-serif; color: var(--accent-2);
  padding: 0 0.6em;
}
.reveal .comparison h3, .slide-standalone.comparison h3 {
  margin: 0 0 0.4em; font-size: var(--fs-body); color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.reveal .comparison .col ul, .slide-standalone.comparison .col ul {
  list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.4em;
}
.reveal .comparison .col li, .slide-standalone.comparison .col li {
  font-size: 0.85em; line-height: 1.35; padding-left: 1.2em; position: relative;
}
.reveal .comparison .col li::before, .slide-standalone.comparison .col li::before {
  content: ""; position: absolute; left: 0; top: 0.55em;
  width: 0.6em; height: 0.6em; border-radius: 50%;
  background: var(--accent);
}

/* Timeline: horizontal sequence of events connected by a centerline. */
.reveal .timeline, .slide-standalone.timeline {
  display: flex; align-items: flex-start; gap: 0; position: relative;
  padding: 0.4em 0 0.6em; margin-top: 0.4em;
  overflow-x: auto;
}
.reveal .timeline::before, .slide-standalone.timeline::before {
  content: ""; position: absolute; left: 2em; right: 2em; top: 1.7em;
  height: 2px; background: var(--border);
}
.reveal .timeline .event, .slide-standalone.timeline .event {
  flex: 1 1 0; min-width: 9em; display: flex; flex-direction: column;
  align-items: center; text-align: center; padding: 0 0.6em; position: relative;
}
.reveal .timeline .event .dot, .slide-standalone.timeline .event .dot {
  width: 0.9em; height: 0.9em; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--bg);
  margin-bottom: 0.4em; position: relative; z-index: 1;
  box-shadow: 0 0 0 2px var(--accent);
}
.reveal .timeline .event .date, .slide-standalone.timeline .event .date {
  font: 700 0.7em 'JetBrains Mono', monospace; color: var(--accent-2);
  letter-spacing: 0.06em; margin-bottom: 0.2em;
}
.reveal .timeline .event .ev-title, .slide-standalone.timeline .event .ev-title {
  font: 700 0.95em 'Manrope', sans-serif; color: var(--fg); margin-bottom: 0.2em;
}
.reveal .timeline .event .body, .slide-standalone.timeline .event .body {
  font-size: 0.7em; color: var(--muted); line-height: 1.35;
}

/* Process: numbered steps connected by chevron arrows. */
.reveal .process, .slide-standalone.process {
  display: flex; align-items: stretch; gap: 0.2em; padding: 0.4em 0;
}
.reveal .process .step, .slide-standalone.process .step {
  flex: 1 1 0; padding: 0.8em 0.9em;
  background: color-mix(in srgb, var(--card) 70%, transparent);
  border: 1px solid var(--border); border-radius: 0.8em;
  display: flex; flex-direction: column; gap: 0.3em;
  position: relative; min-width: 0;
}
.reveal .process .step + .step::before, .slide-standalone.process .step + .step::before {
  content: ""; position: absolute; left: -0.5em; top: 50%; transform: translateY(-50%);
  width: 0; height: 0;
  border-top: 0.5em solid transparent; border-bottom: 0.5em solid transparent;
  border-left: 0.6em solid var(--accent);
}
.reveal .process .step .num, .slide-standalone.process .step .num {
  font: 800 1.6em 'Manrope', sans-serif; color: var(--accent-2); line-height: 1;
}
.reveal .process .step .title, .slide-standalone.process .step .title {
  font: 700 0.9em 'Manrope', sans-serif; color: var(--fg);
}
.reveal .process .step .body, .slide-standalone.process .step .body {
  font-size: 0.72em; color: var(--muted); line-height: 1.35;
}

/* Cards: 3-4 icon + title + body cards in a flex grid. */
.reveal .cards, .slide-standalone.cards {
  display: grid; gap: 0.9em;
  grid-template-columns: repeat(auto-fit, minmax(13em, 1fr));
  padding: 0.4em 0;
}
.reveal .cards .card, .slide-standalone.cards .card {
  background: color-mix(in srgb, var(--card) 80%, transparent);
  border: 1px solid var(--border); border-radius: 0.9em;
  padding: 0.9em 1em; display: flex; flex-direction: column; gap: 0.4em;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.reveal .cards .card:hover, .slide-standalone.cards .card:hover {
  transform: translateY(-2px); border-color: var(--accent);
}
.reveal .cards .card .icon, .slide-standalone.cards .card .icon {
  width: 2.4em; height: 2.4em; border-radius: 0.6em;
  display: inline-flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  color: var(--accent);
}
.reveal .cards .card .icon .svg-icon, .slide-standalone.cards .card .icon .svg-icon {
  width: 1.4em; height: 1.4em;
}
.reveal .cards .card .title, .slide-standalone.cards .card .title {
  font: 700 1em 'Manrope', sans-serif; color: var(--fg);
}
.reveal .cards .card .body, .slide-standalone.cards .card .body {
  font-size: 0.8em; color: var(--muted); line-height: 1.4;
}

/* Standalone (PNG export) sizing — mirror the reveal-side type scale. */
.slide-standalone.comparison h2,
.slide-standalone.timeline h2,
.slide-standalone.process h2,
.slide-standalone.cards h2 { font-size: 80px; margin: 0 0 0.6em; color: var(--fg); }
.slide-standalone.comparison .col h3 { font-size: 36px; }
.slide-standalone.comparison .col li { font-size: 30px; line-height: 1.3; }
.slide-standalone.comparison .vs { font-size: 56px; }
.slide-standalone.timeline .event { min-width: 280px; padding: 0 24px; }
.slide-standalone.timeline .event .dot { width: 32px; height: 32px; border-width: 8px; margin-bottom: 20px; }
.slide-standalone.timeline .event .date { font-size: 24px; margin-bottom: 8px; }
.slide-standalone.timeline .event .ev-title { font-size: 32px; margin-bottom: 8px; }
.slide-standalone.timeline .event .body { font-size: 22px; }
.slide-standalone.timeline::before { top: 56px; left: 60px; right: 60px; height: 4px; }
.slide-standalone.process .step { padding: 28px 32px; border-radius: 24px; }
.slide-standalone.process .step + .step::before { left: -16px; border-top-width: 16px; border-bottom-width: 16px; border-left-width: 22px; }
.slide-standalone.process .step .num { font-size: 56px; }
.slide-standalone.process .step .title { font-size: 30px; }
.slide-standalone.process .step .body { font-size: 24px; }
.slide-standalone.cards { gap: 32px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
.slide-standalone.cards .card { padding: 32px 36px; border-radius: 28px; }
.slide-standalone.cards .card .icon { width: 80px; height: 80px; border-radius: 20px; }
.slide-standalone.cards .card .icon .svg-icon { width: 48px; height: 48px; }
.slide-standalone.cards .card .title { font-size: 34px; }
.slide-standalone.cards .card .body { font-size: 26px; }

/* === New layouts (v2.5): section-divider, agenda, big-number, callout, matrix, image-grid === */
.reveal .section-divider, .slide-standalone.section-divider {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 0.6em;
}
.reveal .section-divider .kicker, .slide-standalone.section-divider .kicker {
  font-size: 1.6em; color: var(--accent); font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 0.3em;
}
.reveal .section-divider h1, .slide-standalone.section-divider h1 {
  font-size: var(--fs-cover); line-height: var(--lh-display);
  color: var(--fg); max-width: 80vw; margin: 0;
}
.reveal .section-divider .sub, .slide-standalone.section-divider .sub {
  font-size: 1.4em; color: var(--muted); margin-top: 0.5em;
}
.slide-standalone.section-divider .kicker { font-size: 56px; }
.slide-standalone.section-divider h1 { font-size: 168px; }
.slide-standalone.section-divider .sub { font-size: 48px; }

.reveal .agenda, .slide-standalone .agenda {
  display: flex; flex-direction: column; gap: 0.7em; margin-top: 0.6em;
}
.reveal .agenda .agenda-item, .slide-standalone .agenda .agenda-item {
  display: flex; align-items: baseline; gap: 1em;
  padding: 0.4em 0; border-bottom: 1px solid var(--border);
}
.reveal .agenda .agenda-num, .slide-standalone .agenda .agenda-num {
  flex: 0 0 auto; min-width: 2em; font-size: 1.8em; font-weight: 800;
  color: var(--accent); text-align: right; font-variant-numeric: tabular-nums;
}
.reveal .agenda .agenda-title, .slide-standalone .agenda .agenda-title {
  font-size: 1.3em; font-weight: 600; color: var(--fg);
}
.reveal .agenda .agenda-desc, .slide-standalone .agenda .agenda-desc {
  font-size: 0.9em; color: var(--muted); margin-top: 0.15em;
}
.slide-standalone .agenda .agenda-num { font-size: 56px; min-width: 80px; }
.slide-standalone .agenda .agenda-title { font-size: 40px; }
.slide-standalone .agenda .agenda-desc { font-size: 28px; }

.reveal .big-number, .slide-standalone.big-number {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  justify-content: center; gap: 0.6em;
}
.reveal .big-number .big-num-value, .slide-standalone.big-number .big-num-value {
  font-size: 8em; font-weight: 800; color: var(--accent);
  font-variant-numeric: tabular-nums; line-height: 0.95;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.reveal .big-number .big-num-label, .slide-standalone.big-number .big-num-label {
  font-size: 1.8em; color: var(--fg); font-weight: 600; max-width: 70vw;
}
.reveal .big-number ul.bullets, .slide-standalone.big-number ul.bullets {
  margin-top: 1em; text-align: left; max-width: 60vw;
}
.slide-standalone.big-number .big-num-value { font-size: 360px; }
.slide-standalone.big-number .big-num-label { font-size: 56px; max-width: 1500px; }
.slide-standalone.big-number ul.bullets li { font-size: 40px; padding-left: 56px; }
.slide-standalone.big-number ul.bullets li::before { font-size: 32px; left: 0; }

.reveal .callout-box, .slide-standalone .callout-box {
  display: flex; gap: 2em; align-items: center;
  background: var(--card); border: 2px solid var(--accent);
  border-radius: 18px; padding: 1.4em 2em; margin-top: 1em;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.reveal .callout-box .callout-icon, .slide-standalone .callout-box .callout-icon {
  flex: 0 0 auto; color: var(--accent);
}
.reveal .callout-box .callout-bullets, .slide-standalone .callout-box .callout-bullets {
  list-style: none; padding: 0; margin: 0; flex: 1;
}
.reveal .callout-box .callout-bullets li, .slide-standalone .callout-box .callout-bullets li {
  font-size: 1.4em; color: var(--fg); padding: 0.4em 0; line-height: 1.35;
}
.reveal .callout-box .callout-bullets li::before, .slide-standalone .callout-box .callout-bullets li::before {
  content: '→'; color: var(--accent); margin-right: 0.5em; font-weight: 700;
}
.slide-standalone .callout-box { padding: 64px 80px; gap: 56px; border-radius: 36px; }
.slide-standalone .callout-box .callout-bullets li { font-size: 44px; padding: 16px 0; }

.reveal section.matrix-slide, .slide-standalone.matrix-slide {
  display: flex; flex-direction: column;
}
.reveal .matrix-grid, .slide-standalone .matrix-grid {
  display: grid;
  grid-template-columns: auto 1fr 1fr auto;
  grid-template-rows: auto 1fr 1fr auto;
  gap: 8px; margin-top: 1em; flex: 1;
  --cell-bg: var(--card); --cell-border: var(--border);
}
.reveal .matrix-axis, .slide-standalone .matrix-axis {
  display: flex; align-items: center; justify-content: center;
  font-size: 0.9em; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em;
  padding: 0.3em 0.6em;
}
.reveal .matrix-axis-top,    .slide-standalone .matrix-axis-top    { grid-column: 2 / 4; grid-row: 1; }
.reveal .matrix-axis-bottom, .slide-standalone .matrix-axis-bottom { grid-column: 2 / 4; grid-row: 4; }
.reveal .matrix-axis-left,   .slide-standalone .matrix-axis-left   { grid-column: 1; grid-row: 2 / 4; writing-mode: vertical-rl; transform: rotate(180deg); }
.reveal .matrix-axis-right,  .slide-standalone .matrix-axis-right  { grid-column: 4; grid-row: 2 / 4; writing-mode: vertical-rl; }
.reveal .matrix-cell, .slide-standalone .matrix-cell {
  background: var(--cell-bg); border: 1px solid var(--cell-border);
  border-radius: 12px; padding: 1em 1.2em;
  display: flex; flex-direction: column; justify-content: center; gap: 0.3em;
}
.reveal .matrix-cell:nth-child(3), .slide-standalone .matrix-cell:nth-child(3) { border-color: var(--accent); }
.reveal .matrix-cell .matrix-label, .slide-standalone .matrix-cell .matrix-label {
  font-size: 1.4em; font-weight: 700; color: var(--fg);
}
.reveal .matrix-cell .matrix-body, .slide-standalone .matrix-cell .matrix-body {
  font-size: 1em; color: var(--muted); line-height: 1.35;
}
.slide-standalone.matrix-slide .matrix-grid { gap: 16px; }
.slide-standalone .matrix-axis { font-size: 28px; padding: 12px 24px; }
.slide-standalone .matrix-cell { padding: 32px 40px; border-radius: 24px; }
.slide-standalone .matrix-cell .matrix-label { font-size: 40px; }
.slide-standalone .matrix-cell .matrix-body { font-size: 28px; }

.reveal .image-grid, .slide-standalone .image-grid {
  display: grid; gap: 18px; margin-top: 0.8em; flex: 1;
}
.reveal .image-grid-2, .slide-standalone .image-grid-2 { grid-template-columns: 1fr 1fr; }
.reveal .image-grid-3, .slide-standalone .image-grid-3 { grid-template-columns: repeat(3, 1fr); }
.reveal .image-grid-4, .slide-standalone .image-grid-4 { grid-template-columns: repeat(4, 1fr); }
.reveal .image-grid .image-grid-cell, .slide-standalone .image-grid .image-grid-cell {
  display: flex; flex-direction: column; gap: 8px;
}
.reveal .image-grid .image-grid-img, .slide-standalone .image-grid .image-grid-img {
  flex: 1; min-height: 0;
  background-size: cover; background-position: center;
  border-radius: 12px; border: 1px solid var(--border);
  background-color: var(--card);
}
.reveal .image-grid .image-grid-caption, .slide-standalone .image-grid .image-grid-caption {
  font-size: 0.95em; color: var(--muted); font-weight: 600;
}
.reveal .image-grid-attribution, .slide-standalone .image-grid-attribution {
  font-size: 0.7em; color: var(--muted); margin-top: 8px; font-style: italic;
}
.slide-standalone .image-grid { gap: 32px; }
.slide-standalone .image-grid .image-grid-img { border-radius: 20px; }
.slide-standalone .image-grid .image-grid-caption { font-size: 28px; }
.slide-standalone .image-grid-attribution { font-size: 22px; margin-top: 16px; }

/* Animated SVG charts — use user-space transform-origin (set inline per-bar) */
@keyframes bar-grow { from { transform: scaleY(0); } }
@keyframes line-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes slice-sweep { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fade-zoom  { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }
.chart-svg .bar { animation: bar-grow 0.7s cubic-bezier(0.2,0.8,0.2,1) both;
  animation-delay: calc(var(--i, 0) * 70ms); }
.chart-svg .line { stroke-dasharray: 1; animation: line-draw 1.2s ease-in-out both;
  animation-delay: calc(var(--i, 0) * 150ms + 200ms); }
.chart-svg .slice { animation: slice-sweep 0.5s cubic-bezier(0.2,0.8,0.2,1) both;
  animation-delay: calc(var(--i, 0) * 90ms); }

/* === LLM-controlled SVG asset slots (per layout) ===================== */
.svg-slot { display: flex; align-items: center; justify-content: center; margin: 0.4em 0; }
.svg-slot .svg-asset { max-width: 100%; max-height: 100%; }
/* cover: kicker-top slot places SVG between kicker and h1 */
.reveal .cover .svg-slot--kicker-top,
.slide-standalone.cover .svg-slot--kicker-top { order: 1; max-height: 38vh; }
.reveal .cover .kicker, .slide-standalone.cover .kicker { order: 0; }
.reveal .cover h1, .slide-standalone.cover h1 { order: 2; }
.reveal .cover .sub, .slide-standalone.cover .sub { order: 3; }
.reveal .cover, .slide-standalone.cover { display: flex; flex-direction: column; align-items: stretch; }
/* content / chart: right-pane (≈38% width) wraps title+bullets left, svg right */
.reveal section:not(.image-slide):not(.code-slide):not(.mermaid-slide):not(.comparison) > .svg-slot--right-pane,
.slide-standalone.content .svg-slot--right-pane,
.slide-standalone.chart .svg-slot--right-pane { position: absolute; right: 4vw; top: 22vh; width: 32vw; max-height: 60vh; }
.reveal section:not(.image-slide):not(.code-slide):not(.mermaid-slide):not(.comparison) > .svg-slot--right-pane + .bullets,
.slide-standalone.content .svg-slot--right-pane + .bullets { max-width: 56%; }
/* stats: bottom-strip below the 2x2 grid */
.slide-standalone.stats .svg-slot--bottom-strip,
.reveal .stats .svg-slot--bottom-strip { grid-column: 1 / -1; max-height: 26vh; margin-top: 0.6em; }
.reveal .stats > .grid, .slide-standalone.stats .grid { display: grid; }
/* closing: middle slot renders between h1 and subtitle */
.reveal .closing, .slide-standalone.closing { display: flex; flex-direction: column; align-items: stretch; }
.reveal .closing .svg-slot--middle, .slide-standalone.closing .svg-slot--middle { order: 2; max-height: 38vh; }
.reveal .closing h1, .slide-standalone.closing h1 { order: 1; }
.reveal .closing .sub, .slide-standalone.closing .sub { order: 3; }
/* free-form deco overlays are absolutely positioned via inline style already */
.deco-svg { animation: deco-svg-in 0.7s cubic-bezier(0.2,0.8,0.2,1) both; }
@keyframes deco-svg-in { from { opacity: 0; transform: translateY(-0.4em) scale(0.96); } to { opacity: 1; transform: none; } }

/* === Timeline step-by-step animation ================================== */
/* The inner .timeline row also needs the flex-row layout in standalone mode
   (the standalone wrapper has class slide-standalone.timeline, but the inner
   row is just .timeline — match it as a descendant selector to keep the row). */
.slide-standalone.timeline > .timeline,
.slide-standalone.process > .process { display: flex; align-items: flex-start; gap: 0; position: relative; padding: 0.4em 0 0.6em; margin-top: 0.4em; overflow-x: auto; }
.slide-standalone.process > .process { flex-wrap: wrap; gap: 0.6em; }
/* Centerline grows from 0% to 100% width across all events. */
@keyframes timeline-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.reveal .timeline::before, .slide-standalone.timeline::before {
  transform-origin: left center;
  animation: timeline-grow 0.9s cubic-bezier(0.2,0.8,0.2,1) both;
  animation-delay: 0.1s;
}
/* Each event fades+slides in with a staggered delay (relative to the wrapper). */
.reveal .timeline .event, .slide-standalone.timeline .event {
  animation: fade-up 0.5s cubic-bezier(0.2,0.8,0.2,1) both;
  animation-delay: calc(0.25s * var(--event-i, 0) + 0.2s);
}
/* Reveal mode hides each event behind its from state during stagger. */
.reveal .timeline .event {
  opacity: 0; transform: translateY(0.6em);
}
@keyframes dot-pulse { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
.reveal .timeline .event .dot, .slide-standalone.timeline .event .dot {
  animation: dot-pulse 0.6s cubic-bezier(0.2,0.8,0.2,1) both;
  animation-delay: calc(0.25s * var(--event-i, 0) + 0.1s);
}
/* process steps: faint stagger so the chain reads sequentially on first paint */
.reveal .process .step, .slide-standalone.process .step {
  animation: fade-up 0.5s cubic-bezier(0.2,0.8,0.2,1) both;
  animation-delay: calc(0.18s * var(--step-i, 0));
}
.reveal .process .step {
  opacity: 0; transform: translateY(0.6em);
}

/* === Stat values: reusable fade-up (multi-token chains stack delays) === */
.reveal .stat .v, .slide-standalone .stat .v {
  animation: fade-up 0.6s cubic-bezier(0.2,0.8,0.2,1) both;
}

/* Image layout: full-bleed background + overlay caption */
.reveal .image-slide,
.slide-standalone.image-slide {
  position: relative;
  padding: 0;
  display: flex;
  align-items: flex-end;
  justify-content: flex-start;
}
.reveal .image-slide .image-bg,
.slide-standalone.image-slide .image-bg {
  position: absolute; inset: 0;
  background-color: var(--bg);
  animation: fade-zoom 0.8s ease-out both;
}
.reveal .image-slide .image-overlay,
.slide-standalone.image-slide .image-overlay {
  position: relative;
  z-index: 1;
  padding: 1em 1.2em 2em;
  max-width: 70%;
  background: linear-gradient(0deg, color-mix(in srgb, var(--bg) 88%, transparent) 0%, transparent 100%);
  margin: 0;
}
.reveal .image-slide .image-overlay h2,
.slide-standalone.image-slide .image-overlay h2 {
  font-size: var(--fs-title);
  border-bottom: 4px solid var(--accent);
  margin: 0 0 0.3em;
  color: var(--fg);
}
.slide-standalone.image-slide .image-overlay { padding: 64px 96px; max-width: 70%; }
.slide-standalone.image-slide .image-overlay h2 { font-size: 88px; }

/* Image overlay needs light text on dark gradient regardless of theme */

/* ===== Task 04 — code / mermaid / notes layouts ===== */
.code-block { width: 100%; display: flex; flex-direction: column; gap: 0.4em;
  margin-top: 0.4em; }

}

  border-radius: 20px; line-height: 1.5; }

/* Mermaid block: center the rendered SVG; the runner replaces the text
   inside <pre class="mermaid"> with SVG once mermaid.run() resolves. */

/* Speaker notes aside — hidden by RevealNotes plugin, never set display:none. */
aside.notes { display: none; }

@media (prefers-reduced-motion: reduce) {

  .reveal .image-slide .image-bg, .slide-standalone.image-slide .image-bg,
  .reveal section, .slide-standalone,
  [data-animate] {
    animation: none !important; transform: none !important; stroke-dashoffset: 0 !important;
    transition: none !important;
  }

}

/* ===== Text animations (opt-in via data-animate on slide elements) ===== */
/* New rich set: directional slide-in (left/right/top/bottom), pure fade (in/out),
   typewriter, and pulse. Multiple animations can be MERGED per element by passing
   an array (see ANIMATION_MAP) — composed into a comma-separated CSS animation. */
@keyframes slide-in-left  { from { opacity: 0; transform: translateX(-1.5em); } to { opacity: 1; transform: translateX(0); } }
@keyframes slide-in-right { from { opacity: 0; transform: translateX( 1.5em); } to { opacity: 1; transform: translateX(0); } }
@keyframes slide-in-top   { from { opacity: 0; transform: translateY(-1.2em); } to { opacity: 1; transform: translateY(0); } }
@keyframes slide-in-bottom{ from { opacity: 0; transform: translateY( 1.2em); } to { opacity: 1; transform: translateY(0); } }
@keyframes fade-in        { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-out       { from { opacity: 1; } to { opacity: 0; } }
@keyframes fade-up        { from { opacity: 0; transform: translateY(0.6em); } to { opacity: 1; transform: translateY(0); } }
@keyframes slide-in       { from { opacity: 0; transform: translateX(-1.5em); } to { opacity: 1; transform: translateX(0); } }
@keyframes typewriter     { from { width: 0; } to { width: 100%; } }
@keyframes pulse-glow     { 0%,100% { text-shadow: 0 0 0 transparent; } 50% { text-shadow: 0 0 0.4em currentColor; } }

[data-animate="slide-in-left"]   { animation: slide-in-left   0.6s cubic-bezier(0.2,0.8,0.2,1) both; }
[data-animate="slide-in-right"]  { animation: slide-in-right  0.6s cubic-bezier(0.2,0.8,0.2,1) both; }
[data-animate="slide-in-top"]    { animation: slide-in-top    0.6s cubic-bezier(0.2,0.8,0.2,1) both; }
[data-animate="slide-in-bottom"] { animation: slide-in-bottom 0.6s cubic-bezier(0.2,0.8,0.2,1) both; }
[data-animate="fade-in"]         { animation: fade-in         0.6s ease-out both; }
[data-animate="fade-out"]        { animation: fade-out        0.5s ease-in  both; }
[data-animate="fade-up"]         { animation: fade-up         0.5s cubic-bezier(0.2,0.8,0.2,1) both; }
[data-animate="slide-in"]        { animation: slide-in        0.6s cubic-bezier(0.2,0.8,0.2,1) both; }
[data-animate="typewriter"]      { display: inline-block; overflow: hidden; white-space: nowrap;
  animation: typewriter 1.2s steps(40) both; vertical-align: bottom; }
[data-animate="pulse"]           { animation: pulse-glow 1.6s ease-in-out infinite; }

/* ===== Highlight (keyword emphasis) + inline arrows ===== */
.reveal .hl, .slide-standalone .hl { color: var(--accent-2); font-weight: 700;
  background: linear-gradient(180deg, transparent 55%, color-mix(in srgb, var(--accent-2) 28%, transparent) 55%);
  padding: 0 0.08em; border-radius: 0.15em; }
.reveal .arrow, .slide-standalone .arrow { color: var(--accent); font-weight: 700;
  display: inline-block; transform: translateY(-0.05em); margin: 0 0.15em;
  text-shadow: 0 0 0.6em color-mix(in srgb, var(--accent) 35%, transparent); }

/* ===== Directional arrow decorations (SVG, slide overlay) ===== */
.deco-arrow { position: absolute; pointer-events: none; }
.deco-arrow svg { width: 100%; height: 100%; overflow: visible; }
.deco-arrow .deco-line { stroke: var(--accent); stroke-width: 5; fill: none;
  stroke-linecap: round; stroke-dasharray: 1200; stroke-dashoffset: 1200;
  animation: deco-draw 0.8s ease-out 0.2s forwards; }
.deco-arrow .deco-head { fill: var(--accent); opacity: 0;
  animation: deco-pop 0.35s ease-out 0.95s forwards; }
.deco-arrow .deco-label { fill: var(--fg); font: 700 22px 'Manrope', system-ui, sans-serif;
  opacity: 0; animation: deco-fade 0.4s ease-out 1.1s forwards; }
@keyframes deco-draw { to { stroke-dashoffset: 0; } }
@keyframes deco-pop  { to { opacity: 1; } }
@keyframes deco-fade { to { opacity: 0.9; } }

/* ===== Count-up indicator shimmer (CSS-only visual cue while JS animates) ===== */
[data-countup] {
  font-variant-numeric: tabular-nums;
  background: linear-gradient(90deg, currentColor 0%, currentColor 100%) no-repeat 0 100% / 0% 3px;
  animation: countup-underline 0.4s ease-out forwards;
}
@keyframes countup-underline { from { background-size: 0% 3px; } to { background-size: 100% 3px; } }

/* Chart colors: bind to CSS vars so they update with the theme */
.chart-svg { --c1: var(--c1); --c2: var(--c2); --c3: var(--c3); --c4: var(--c4);
  --c5: var(--c5); --c6: var(--c6); --c7: var(--c7); --c8: var(--c8); }

/* Per-slide standalone (no reveal.js) styles — explicit pixel sizes for 1920x1080 raster */
body { margin: 0; }
.slide-standalone {
  width: 1920px; height: 1080px; padding: 96px 120px; box-sizing: border-box;
  background: var(--gradient); color: var(--fg);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
}
.slide-standalone .slide-foot { position: absolute; bottom: 48px; left: 120px; right: 120px;

.slide-standalone .slide-foot a { color: var(--accent); text-decoration: none; }
.slide-standalone .slide-foot .pn { font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
  background: var(--card); padding: 6px 16px; border-radius: 999px; }
.slide-standalone h1 { font-size: 144px; line-height: var(--lh-display); font-weight: 800;

.slide-standalone h2 { font-size: 88px; font-weight: 700; line-height: var(--lh-title);
  margin: 0 0 48px; border-bottom: 4px solid var(--accent); padding-bottom: 24px; }
.slide-standalone h3 { font-size: 56px; font-weight: 700; color: var(--accent); margin: 0 0 24px; }
.slide-standalone .kicker { color: var(--accent); font-weight: 600; letter-spacing: 0.2em;
  text-transform: uppercase; font-size: 28px; margin-bottom: 32px; }
.slide-standalone .sub { color: var(--muted); font-size: 48px; margin-top: 32px; line-height: 1.3; }
.slide-standalone .bullets { list-style: none; padding: 0; margin: 0; flex: 1;
  display: flex; flex-direction: column; gap: 36px; justify-content: center; }
.slide-standalone .bullets li { font-size: 48px; line-height: 1.35;
  padding-left: 64px; position: relative; }
.slide-standalone .bullets li::before { content: '▸'; position: absolute; left: 0;
  color: var(--accent-2); font-size: 44px; font-weight: 700; line-height: 1; top: 8px; }
.slide-standalone .grid { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 56px; align-items: center; }
.slide-standalone .stat { background: var(--card); border: 1px solid var(--border);
  border-radius: 28px; padding: 64px; text-align: center; }
.slide-standalone .stat .v { font-size: 112px; font-weight: 800; color: var(--accent);
  line-height: 1; word-break: break-word; letter-spacing: -0.02em; }
.slide-standalone .stat-v-gradient { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.slide-standalone .stat .u { display: block; font-size: 36px; color: var(--muted);
  margin-top: 12px; font-weight: 500; }
.slide-standalone .stat .l { font-size: 32px; color: var(--muted); margin-top: 28px; line-height: 1.25; }
.slide-standalone blockquote { font-size: 96px; font-style: italic; line-height: 1.2;
  max-width: 80%; margin: 0 auto; text-align: center; color: var(--fg); }
.slide-standalone blockquote::before, .slide-standalone blockquote::after { content: '"';
  color: var(--accent); font-weight: 700; }
.slide-standalone .cite { display: block; margin-top: 48px; font-size: 36px;
  color: var(--muted); text-align: center; font-style: normal; }
.slide-standalone.cover { justify-content: center; padding-top: 0; padding-bottom: 0; }
.slide-standalone.cover h1 { font-size: 168px; margin-bottom: 24px; }
.slide-standalone.cover .kicker { font-size: 32px; }
.slide-standalone.cover .sub { font-size: 56px; }

.slide-standalone.closing h1 { font-size: 168px; margin-bottom: 24px; }

        <div class="process">
        <div class="step" style="--step-i:0;">
          <div class="num">1</div>
          <div class="title">Rio</div>
          <div class="body">Água do São Francisco</div>
        </div>
        <div class="step" style="--step-i:1;">
          <div class="num">2</div>
          <div class="title">Irrigação</div>

        </div></div>
        
      </div>
<script>
(function(){
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var easings = {
    linear:       function(t){ return t; },
    easeOutExpo:  function(t){ return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); },
    easeOutCubic: function(t){ return 1 - Math.pow(1 - t, 3); },
    easeOutQuart: function(t){ return 1 - Math.pow(1 - t, 4); }
  };
  function fmt(v, d, p, s, g){
    var str = d > 0 ? v.toFixed(d) : String(Math.round(v));
    if (g) str = Number(str).toLocaleString('en-US');
    return (p || '') + str + (s || '');
  }
  function animateEl(el){
    var from  = parseFloat(el.dataset.countupFrom     || '0');
    var to    = parseFloat(el.dataset.countupTo       || el.textContent.replace(/[^0-9.\-]/g,'') || '0');
    var dur   = parseFloat(el.dataset.countupDuration || '1.5') * 1000;
    var ease  = el.dataset.countupEasing || 'easeOutCubic';
    var dec   = parseInt(el.dataset.countupDecimals   || '0', 10);
    var pre   = el.dataset.countupPrefix || '';
    var suf   = el.dataset.countupSuffix || '';
    var grp   = el.dataset.countupGrouping === 'true';
    if (REDUCED || !isFinite(to)) {
      el.textContent = fmt(to, dec, pre, suf, grp);
      el.dataset.countupDone = 'true';
      return;
    }
    el.textContent = fmt(from, dec, pre, suf, grp);
    el.dataset.countupDone = 'false';
    var start = performance.now();
    function step(now){
      var t = Math.min((now - start) / dur, 1);
      var e = (easings[ease] || easings.linear)(t);
      var v = from + (to - from) * e;
      el.textContent = fmt(v, dec, pre, suf, grp);
      if (t < 1) requestAnimationFrame(step);
      else { el.textContent = fmt(to, dec, pre, suf, grp); el.dataset.countupDone = 'true'; }
    }
    requestAnimationFrame(step);
  }
  function init(){
    document.querySelectorAll('[data-countup]').forEach(animateEl);
    if (window.Reveal) {
      Reveal.on('slidechanged', function(e){
        e.currentSlide.querySelectorAll('[data-countup]').forEach(animateEl);
      });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();


(function(){
  var R = window.Reveal;
  function restart(el) {
    if (!el || !el.hasAttribute || !el.hasAttribute('data-animate')) return;
    var orig = el.style.animation;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = orig;
  }
  function init() {
    if (!R) return;
    R.on('fragmentshown', function(e){ restart(e && e.fragment); });
    // Cover/closing slides have animated h1 without class="fragment"; the
    // animation already fired at parse time, but if the user navigates back
    // to them, re-fire so it plays each visit.
    R.on('slidechanged', function(e){
      var s = e && e.currentSlide;
      if (!s) return;
      s.querySelectorAll('[data-animate]:not(.fragment)').forEach(function(el){
        if (el.__animatePlayed) return;
        el.__animatePlayed = true;
        restart(el);
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script></body></html>
